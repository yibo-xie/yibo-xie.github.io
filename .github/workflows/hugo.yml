name: Deploy Hugo

on: 
  push:
    branches:
      - main
    
permissions:   # ✅ 改为复数 permissions
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: CheckOut
        uses: actions/checkout@v4   # ⚠️ 建议改为 actions/checkout@v4（注意是 actions 不是 action）
        with:
          submodules: recursive
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: latest
          extend: true
      
      - name: Build
        run: hugo
      
      - name: Upload
        uses: actions/upload-pages-artifact@v3   # ⚠️ upload 是小写
        with:
          path: ./public

  deploy:
    
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
    
    permissions:   # ✅ 同样改为复数
      pages: write
      id-token: write

    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4